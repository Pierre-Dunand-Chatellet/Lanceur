<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lanceur">
  <title>Lanceur</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f2a"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
  </defs>

  <!-- tuile de l'icône -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- deux pochettes en éventail derrière -->
  <rect x="161" y="108" width="190" height="290" rx="32" fill="url(#accent)" opacity="0.28" transform="rotate(-15 256 253)"/>
  <rect x="161" y="108" width="190" height="290" rx="32" fill="url(#accent)" opacity="0.52" transform="rotate(15 256 253)"/>

  <!-- pochette de face (centre : 256, 253) -->
  <rect x="161" y="108" width="190" height="290" rx="32" fill="url(#accent)"/>

  <!-- bouton lecture évidé : son centre de gravité est exactement au centre de la pochette -->
  <polygon points="226,203 226,303 316,253" fill="#0e1014" stroke="#0e1014" stroke-width="16" stroke-linejoin="round"/>
</svg>
